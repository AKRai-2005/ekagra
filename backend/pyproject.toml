[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekagra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy","pandas","scikit-learn","xgboost","matplotlib","scipy","cryptography"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
